<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paraules amb dibuixos</title>
  <meta name="description" content="Joc de lletres en català amb dibuixos i quatre nivells.">
<style>
* {
  box-sizing: border-box;
}

body {
  font-family: "Nunito", system-ui, sans-serif;
  margin: 0;
  background: #fff9ef;
  color: #262188;
}

main {
  max-width: 1060px;
  margin: auto;
  padding: 32px 18px 48px;
}

h1 {
  font-size: clamp(2rem, 6vw, 3.2rem);
  line-height: 1.05;
  margin: 0 0 16px;
}

h2 {
  margin: 30px 0 12px;
  font-size: 1.35rem;
}

p {
  line-height: 1.5;
  max-width: 65ch;
}

[hidden] {
  display: none !important;
}

button {
  cursor: pointer;
  font: inherit;
}

.game {
  margin: 20px 0 28px;
  background: white;
  border: 1px solid #e8dfd5;
  border-radius: 24px;
  padding: clamp(12px, 4vw, 32px);
}

.levels {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
  width: min(100%, 580px);
  margin-inline: auto;
}

.levels button {
  text-align: center;
  min-height: 62px;
  padding: 12px 14px;
  border: 2px solid #ded1fa;
  border-radius: 14px;
  background: #f7f0ff;
  color: #342251;
}

.levels strong {
  font-size: 1.15rem;
}

.game h2 {
  margin-top: 0;
}

.game-bar {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.game-bar button {
  border: 0;
  background: #efe7ff;
  color: #342251;
  border-radius: 10px;
  padding: 8px 12px;
}

#round, #finish {
  text-align: center;
}

.game-picture {
  display: grid;
  place-items: center;
  font-size: 104px;
  min-height: 150px;
}

.game-picture img {
  width: 116px;
  height: 116px;
}

#letters {
  display: flex;
  justify-content: center;
  gap: clamp(3px, 1vw, 9px);
}

.letter {
  display: grid;
  place-items: center;
  width: min(8.6vw, 56px);
  height: clamp(42px, 10vw, 66px);
  min-width: 0;
  border: 2px solid #d2bee9;
  border-radius: 8px;
  font: 800 clamp(1.1rem, 4.6vw, 2rem) system-ui;
  text-align: center;
  color: #262038;
  background: #fff;
  padding: 0;
}

.given {
  background: #efe7ff;
  border-color: #efe7ff;
}

.letter.correct {
  background: #d9f6dc;
  color: #18582b;
  border-color: #399852;
}

.letter[aria-invalid="true"] {
  background: #ffe4e0;
  color: #992824;
  border-color: #cc534b;
}

button:focus-visible, .letter:focus-visible, summary:focus-visible {
  outline: 3px solid #6544a7;
  outline-offset: 2px;
}

#celebration {
  min-height: 74px;
  padding-top: 10px;
  font-weight: 800;
  color: #18582b;
}

#applause {
  display: block;
  font-size: clamp(1.25rem, 5vw, 2rem);
}

#applause.pop {
  animation: clap .35s ease-out;
}

@keyframes clap {
  from {
    transform: scale(.55);
    opacity: 0;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}

@media (prefers-reduced-motion: reduce) {
  #applause.pop {
    animation: none;
  }
}

.primary {
  border: 0;
  border-radius: 12px;
  background: #5a3993;
  color: #fff;
  font-weight: 750;
  padding: 12px 18px;
}

#keyboard {
  display: grid;
  gap: 6px;
}

.key-row {
  display: flex;
  justify-content: center;
  gap: clamp(2px, .8vw, 8px);
}

.key {
  flex: 0 1 62px;
  min-width: 0;
  min-height: 44px;
  padding: 0;
  border: 2px solid #d7c5ed;
  border-radius: 8px;
  background: #f7f0ff;
  color: #302344;
  font-weight: 800;
  touch-action: manipulation;
}

#keyboard.vowels .key {
  flex-basis: 110px;
  min-height: 68px;
  font-size: clamp(1.25rem, 5vw, 2rem);
}

.key:active {
  background: #e3d4f7;
}

#stars {
  --star-color: #e4a523;
  color: var(--star-color);
  display: flex;
  justify-content: center;
  gap: .12em;
  font-size: clamp(1.8rem, 8vw, 4rem);
  line-height: 1.2;
}

#stars.perfect .star:nth-child(1) {
  --star-color: #df519b;
}

#stars.perfect .star:nth-child(2) {
  --star-color: #dd4049;
}

#stars.perfect .star:nth-child(3) {
  --star-color: #327de0;
}

#stars.perfect .star:nth-child(4) {
  --star-color: #efbf25;
}

#stars.perfect .star:nth-child(5) {
  --star-color: #33a854;
}

.star {
  position: relative;
  color: #ded6c7;
}

.star::after {
  content: "★";
  position: absolute;
  top: 0;
  left: 0;
  width: var(--fill);
  overflow: hidden;
  color: var(--star-color);
}

.result-actions {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
}

#score {
  margin: 12px auto 22px;
}

</style>

</head>
<body>
  <main>
    <h1>Paraules amb dibuixos</h1>
    <div class="game">
      <noscript>Activa JavaScript per jugar.</noscript>
      <section id="setup" aria-labelledby="choose">
        <h2 id="choose" tabindex="-1">Tria un nivell</h2>
        <p>Mira el dibuix i escriu les lletres que falten. Cada partida té 8 paraules.</p>
        <div class="levels">
          <button type="button" data-level="1"><strong>Nivell 1</strong> <span aria-hidden="true">·</span> Una o dues vocals</button>
          <button type="button" data-level="2"><strong>Nivell 2</strong> <span aria-hidden="true">·</span> Una vocal i una consonant</button>
          <button type="button" data-level="3"><strong>Nivell 3</strong> <span aria-hidden="true">·</span> Només es veu la primera lletra</button>
          <button type="button" data-level="4"><strong>Nivell 4</strong> <span aria-hidden="true">·</span> Escriu tota la paraula</button>
        </div>
      </section>
      <section id="round" aria-label="Partida" hidden>
        <div class="game-bar">
          <strong id="progress" aria-live="polite"></strong>
          <div>
            <button type="button" id="retry">Torna-ho a provar</button>
            <button type="button" id="change">Canvia de nivell</button>
          </div>
        </div>
        <div id="game-picture" class="game-picture" role="img" aria-label="Dibuix de la paraula"></div>
        <div id="letters" role="group" aria-label="Lletres de la paraula"></div>
        <div id="celebration" role="status">
          <span id="applause" aria-hidden="true"></span>
          <span id="feedback"></span>
        </div>
        <div id="keyboard" role="group" aria-label="Teclat"></div>
      </section>
      <section id="finish" aria-labelledby="finished" hidden>
        <h2 id="finished" tabindex="-1">Molt bé! Has completat 8 paraules!</h2>
        <div id="stars" aria-hidden="true"></div>
        <p id="score"></p>
        <div class="result-actions">
          <button type="button" id="again" class="primary">↻ Torna a jugar</button>
          <button type="button" id="levels" class="primary">Tria un nivell</button>
        </div>
      </section>
    </div>
  </main>

/* TESTED_GAME_RULES_START */
const WORDS_PER_ROUND = 8;

function shuffle(items, random) {
  const shuffled = [...items];
  for (let index = shuffled.length - 1; index > 0; index--) {
    const other = Math.floor(random() * (index + 1));
    [shuffled[index], shuffled[other]] = [shuffled[other], shuffled[index]];
  }
  return shuffled;
}

function baseVowel(letter) {
  const base = letter.normalize('NFD').replace(/\p{M}/gu, '');
  return /^[AEIOU]$/.test(base) ? base : '';
}

function chooseBlanks(letters, level, random) {
  const positions = letters.map((_, position) => position);
  if (level === 4) return positions;
  if (level === 3) return positions.slice(1);

  const vowels = shuffle(positions.filter(position => baseVowel(letters[position])), random);
  if (level === 1) {
    const count = random() < 0.5 ? 1 : 2;
    return vowels.slice(0, Math.min(count, letters.length - 1));
  }

  const consonants = shuffle(positions.filter(position => !baseVowel(letters[position])), random);
  return [vowels[0], consonants[0]];
}

function scoreRound(level, mistakes, penalizedWords) {
  // On levels 3–4, count quarter stars first, then round to the nearest half.
  const halfStars = level <= 2
    ? 10 - Math.floor(mistakes / 4)
    : Math.round((20 - penalizedWords) / 2);
  return { halfStars: Math.max(5, halfStars), perfect: mistakes === 0 };
}

function createRound(deck, level, random = Math.random) {
  const cards = deck.map(card => ({ ...card, letters: Array.from(card.word) }));
  const eligible = cards.filter(({ letters }) => {
    if (level === 1) return letters.some(baseVowel);
    if (level === 2) return letters.some(baseVowel) && letters.some(letter => !baseVowel(letter));
    return true;
  });
  const selected = shuffle(eligible, random).slice(0, WORDS_PER_ROUND);
  if (selected.length < WORDS_PER_ROUND) {
    throw new Error('The deck must contain at least eight eligible words.');
  }

  let index = -1;
  let blanks;
  let solved;
  let mistakes = 0;
  let wordMistakes = 0;
  let penalizedWords = 0;

  function advance() {
    index++;
    if (index === selected.length) return false;
    blanks = new Set(chooseBlanks(selected[index].letters, level, random));
    solved = new Set();
    wordMistakes = 0;
    return true;
  }

  advance();

  return {
    level,
    get number() {
      return index + 1;
    },
    get card() {
      return selected[index];
    },
    isBlank(position) {
      return blanks.has(position);
    },
    retry() {
      solved.clear();
    },
    submit(position, value) {
      if (!blanks.has(position) || solved.has(position)) return null;

      const typed = value.normalize('NFC').toUpperCase().match(/\p{L}/gu)?.at(-1) ?? '';
      if (!typed) return { letter: '', correct: false, complete: false };

      const expected = selected[index].letters[position];
      if (typed !== expected && typed !== baseVowel(expected)) {
        mistakes++;
        wordMistakes++;
        return { letter: typed, correct: false, complete: false };
      }

      solved.add(position);
      const complete = solved.size === blanks.size;
      if (complete && level >= 3 && wordMistakes >= blanks.size) penalizedWords++;
      return { letter: expected, correct: true, complete };
    },
    advance,
    results() {
      return scoreRound(level, mistakes, penalizedWords);
    },
  };
}

/* TESTED_GAME_RULES_END */
const CELEBRATION_MS = 1500;
const KEY_ROWS = ['QWERTYUIOP', 'ASDFGHJKLÇ', 'ZXCVBNM'];
const formatScore = new Intl.NumberFormat('ca');

const view = Object.fromEntries([
  'setup', 'round', 'finish', 'letters', 'progress', 'applause', 'feedback',
  'keyboard', 'retry', 'finished', 'stars', 'score', 'change', 'again', 'levels', 'choose',
].map(id => [id, document.getElementById(id)]));
view.picture = document.getElementById('game-picture');

let game;
let activeField;
let advanceTimer;

function showScreen(screen) {
  for (const name of ['setup', 'round', 'finish']) {
    view[name].hidden = name !== screen;
  }
}

function renderPicture(card) {
  if (!card.artwork) {
    view.picture.textContent = card.emoji;
    return;
  }

  const image = document.createElement('img');
  image.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(clues[card.artwork])}`;
  image.alt = '';
  view.picture.replaceChildren(image);
}

function completeWord() {
  activeField = null;
  view.retry.disabled = true;
  view.applause.textContent = '👏 👏 👏 👏 👏 👏 👏';
  view.applause.classList.add('pop');
  view.feedback.textContent = 'Molt bé!';
  advanceTimer = setTimeout(() => {
    if (game.advance()) renderWord();
    else showResults(game.results());
  }, CELEBRATION_MS);
}

function createLetterField(position, length) {
  const field = document.createElement('input');
  field.type = 'text';
  field.inputMode = 'none';
  field.className = 'letter';
  field.autocomplete = 'off';
  field.autocapitalize = 'characters';
  field.spellcheck = false;
  field.setAttribute('aria-label', `Lletra ${position + 1} de ${length}`);

  function check() {
    // A pending composition event can outlive its word after a retry or level change.
    if (field.readOnly || view.round.hidden || !view.letters.contains(field)) return;
    const result = game.submit(position, field.value);
    if (!result) return;

    field.value = result.letter;
    field.setAttribute('aria-invalid', String(Boolean(result.letter) && !result.correct));
    if (!result.correct) {
      if (result.letter) field.select();
      return;
    }

    field.readOnly = true;
    field.classList.add('correct');
    if (result.complete) {
      completeWord();
    } else {
      const next = view.letters.querySelector('input:not([readonly])');
      next.focus({ preventScroll: true });
      next.select();
    }
  }

  let compositionTimer;
  field.addEventListener('input', event => {
    if (event.isComposing) return;
    clearTimeout(compositionTimer);
    check();
  });
  field.addEventListener('compositionend', () => {
    clearTimeout(compositionTimer);
    compositionTimer = setTimeout(check, 0);
  });
  field.addEventListener('focus', () => {
    if (!field.readOnly) activeField = field;
  });
  return field;
}

function renderWord() {
  const card = game.card;
  view.progress.textContent = `Nivell ${game.level} · Paraula ${game.number} de ${WORDS_PER_ROUND}`;
  view.retry.disabled = false;
  view.applause.textContent = '';
  view.applause.classList.remove('pop');
  view.feedback.textContent = '';
  renderPicture(card);

  const tiles = card.letters.map((letter, position) => {
    if (game.isBlank(position)) return createLetterField(position, card.letters.length);
    const tile = document.createElement('span');
    tile.className = 'letter given';
    tile.textContent = letter;
    return tile;
  });
  view.letters.replaceChildren(...tiles);
  activeField = view.letters.querySelector('input');
  activeField.focus({ preventScroll: true });
}

function renderKeyboard(level) {
  view.keyboard.classList.toggle('vowels', level === 1);
  const rows = (level === 1 ? ['AEIOU'] : KEY_ROWS).map(letters => {
    const row = document.createElement('div');
    row.className = 'key-row';
    for (const letter of letters) {
      const key = document.createElement('button');
      key.type = 'button';
      key.className = 'key';
      key.textContent = letter;
      row.append(key);
    }
    return row;
  });
  view.keyboard.replaceChildren(...rows);
}

function showResults({ halfStars, perfect }) {
  showScreen('finish');
  view.stars.classList.toggle('perfect', perfect);
  const stars = Array.from({ length: 5 }, (_, index) => {
    const star = document.createElement('span');
    star.className = 'star';
    star.textContent = '★';
    const fill = Math.max(0, Math.min(2, halfStars - index * 2)) * 50;
    star.style.setProperty('--fill', `${fill}%`);
    return star;
  });
  view.stars.replaceChildren(...stars);
  view.score.textContent = `${formatScore.format(halfStars / 2)} de 5 estrelles`;
  view.finished.textContent = perfect ? 'Partida perfecta!' : 'Molt bé! Has completat 8 paraules!';
  view.finished.focus();
}

function startRound(level) {
  clearTimeout(advanceTimer);
  game = createRound(deck, level);
  showScreen('round');
  renderKeyboard(level);
  renderWord();
}

function chooseLevel() {
  clearTimeout(advanceTimer);
  activeField = null;
  showScreen('setup');
  view.choose.focus();
}

view.setup.addEventListener('click', event => {
  const button = event.target.closest('button[data-level]');
  if (button) startRound(Number(button.dataset.level));
});
view.keyboard.addEventListener('click', event => {
  const key = event.target.closest('button.key');
  if (!key || !activeField) return;
  activeField.focus({ preventScroll: true });
  activeField.value = key.textContent;
  activeField.dispatchEvent(new Event('input'));
});
view.retry.addEventListener('click', () => {
  game.retry();
  renderWord();
});
view.change.addEventListener('click', chooseLevel);
view.again.addEventListener('click', () => startRound(game.level));
view.levels.addEventListener('click', chooseLevel);

</script>
